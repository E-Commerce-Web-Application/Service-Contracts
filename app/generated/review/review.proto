syntax = "proto3";

package review;

import "google/protobuf/timestamp.proto";


service ReviewService {
  rpc CreateReview (CreateReviewRequest) returns (Review);

  rpc CreateShopReview (CreateShopReviewRequest) returns (Review);

  rpc GetReviewsByProduct (GetReviewsRequest) returns (GetReviewsResponse);

  rpc GetReviewsByShopId (GetReviewsByShopIdRequest) returns (GetReviewsResponse);

  rpc GetAverageRating (GetAverageRatingRequest) returns (AverageRatingResponse);

  rpc GetAverageRatingByShopId (GetAverageRatingByShopIdRequest) returns (AverageRatingResponse);

  rpc UpdateReview (UpdateReviewRequest) returns (Review);

  rpc DeleteReview (DeleteReviewRequest) returns (DeleteReviewResponse);
}

message Review {
  string id = 1;
  string product_id = 2;
  string shop_id = 3;
  string user_id = 4;
  int32 rating = 5;
  string comment = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CreateReviewRequest {
  string product_id = 1;
  string user_id = 2;
  int32 rating = 3;
  string comment = 4;
}

message CreateShopReviewRequest {
  string shop_id = 1;
  string user_id = 2;
  int32 rating = 3;
  string comment = 4;
}

message GetReviewsRequest {
  string product_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message GetReviewsByShopIdRequest {
  string shop_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message GetReviewsResponse {
  repeated Review reviews = 1;
}

message GetAverageRatingRequest {
  string product_id = 1;
}

message GetAverageRatingByShopIdRequest {
  string shop_id = 1;
}

message AverageRatingResponse {
  string product_id = 1;
  string shop_id = 2;
  float avg_rating = 3;
  int32 total_reviews = 4;
}

message UpdateReviewRequest {
  string id = 1;
  string user_id = 2;
  int32 rating = 3;
  string comment = 4;
}

message DeleteReviewRequest {
  string id = 1;
  string user_id = 2;
}

message DeleteReviewResponse {
  string message = 1;
}